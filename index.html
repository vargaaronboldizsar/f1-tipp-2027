
<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10141c">
  <title>F1 Tipp 2027</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #10141c;
      color: #f5f7fa;
      font-family: Arial, sans-serif;
    }
    .panel {
      width: 100%;
      max-width: 460px;
      padding: 36px 28px;
      border: 1px solid #303b4b;
      border-radius: 20px;
      background: #1a2230;
      text-align: center;
      box-shadow: 0 20px 60px #0005;
    }
    .flag { font-size: 42px; }
    h1 { margin: 12px 0; font-size: 30px; }
    h1 span { color: #ff4545; }
    .subtitle { color: #b9c4d3; line-height: 1.6; }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #fff;
      color: #202124;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #status { min-height: 24px; margin-top: 18px; color: #c6d0df; }
    #profile { display: none; margin-top: 22px; }
    #avatar { width: 72px; height: 72px; border-radius: 50%; }
    .secondary { background: #303b4b; color: white; margin-top: 12px; }
  </style>
</head>
<body>
  <main class="panel">
    <div class="flag">🏎️</div>
    <h1>F1 TIPP <span>2027</span></h1>
    <p class="subtitle">
      A saját bajnokságod. A saját tippjeid.<br>
      Jelentkezz be, és készülj a rajtra!
    </p>

    <button id="login">Folytatás Google-fiókkal</button>
    <div id="status" role="status">Betöltés…</div>

    <section id="profile">
      <img id="avatar" alt="Profilkép">
      <h2 id="name"></h2>
      <p id="email"></p>
      <p class="subtitle">Sikeresen bejelentkeztél!</p>
      <button id="logout" class="secondary">Kijelentkezés</button>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
    import {
      getAuth, GoogleAuthProvider, signInWithPopup,
      setPersistence, browserLocalPersistence,
      onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBb-ZNy-Nvsjir_ndT1dB_xX4ajZrbTd08",
      authDomain: "f1-tipp-2027.firebaseapp.com",
      projectId: "f1-tipp-2027",
      storageBucket: "f1-tipp-2027.firebasestorage.app",
      messagingSenderId: "13870451311",
      appId: "1:13870451311:web:afdf86ca30b8aa01a79b9a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const loginButton = document.getElementById("login");
    const logoutButton = document.getElementById("logout");
    const status = document.getElementById("status");
    const profile = document.getElementById("profile");

    loginButton.addEventListener("click", async () => {
      loginButton.disabled = true;
      status.textContent = "Bejelentkezés folyamatban…";
      try {
        await setPersistence(auth, browserLocalPersistence);
        await signInWithPopup(auth, provider);
      } catch (error) {
        status.textContent = "Sikertelen belépés: " + error.message;
      } finally {
        loginButton.disabled = false;
      }
    });

    logoutButton.addEventListener("click", async () => {
      try {
        await signOut(auth);
      } catch (error) {
        status.textContent = "Hiba kijelentkezéskor: " + error.message;
      }
    });

    onAuthStateChanged(auth, user => {
      if (user) {
        loginButton.style.display = "none";
        profile.style.display = "block";
        document.getElementById("name").textContent =
          user.displayName || "Versenyző";
        document.getElementById("email").textContent = user.email || "";
        const avatar = document.getElementById("avatar");
        if (user.photoURL) {
          avatar.src = user.photoURL;
          avatar.style.display = "inline-block";
        } else {
          avatar.style.display = "none";
        }
        status.textContent = "Üdv a rajtrácson!";
      } else {
        loginButton.style.display = "block";
        profile.style.display = "none";
        status.textContent = "Még nem vagy bejelentkezve.";
      }
    });
  </script>
</body>
</html>
